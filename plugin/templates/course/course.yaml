# Course configuration. Validated against schemas/course.schema.json.
{{code_line}}
title: "{{title}}"
institution: "{{institution}}"
instructors:{{instructors}}
# The language the agents write course content in — the syllabus body, guiding questions,
# study paths, the class hour, assessment items. Only English is supported for now (D-001): the
# templates are in English and right-to-left text is untested. Other languages (Hebrew included)
# are deferred, not rejected; there is deliberately no scaffold option for this yet.
language: {{language}}

# Selects the study-session design contract (D-011). See methodologies/.
methodology: "{{methodology}}"

units: {{units}}

# Keys here are what study paths cite, e.g. ref: "CLRS ch.3 pp.45-52".
textbooks: []
  # - key: CLRS
  #   citation: "Cormen, Leiserson, Rivest, Stein — Introduction to Algorithms, 4th ed."

# Per-course overrides of defaults/time-constants.yaml. Any subset.
# ADVISORY ONLY: these help the agents propose a study time for a guiding question,
# and help the critic spot one that looks wrong. The session budget is the sum of the
# per-question `est_minutes` you approve — not anything derived from these.
time_constants: {}

# Tools the course's homework may name — a homework's allowed_tools, an item's tools, an item
# class's default_tools (homework module, HW-D03). Add your own (wireshark, r, a dataset …).
tools:
  pen_and_paper:
    description: "Pen and paper"
    availability: universal
  code_editor:
    description: "A code editor"
    availability: student_download
  ai_assistant:
    description: "An AI assistant"
    availability: student_download

# Course-local agent overrides: framework role -> your replacement agent name.
agents: {}
