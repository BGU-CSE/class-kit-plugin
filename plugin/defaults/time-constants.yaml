# Time constants — an ADVISORY YARDSTICK for estimating study time (D-025).
#
# A session's budget is the sum of its guiding questions' `est_minutes` — numbers the teacher
# approves (D-020). The study-session designer uses these constants to PROPOSE an estimate
# ("4 pages of proofs ≈ 8 min") and the course critic uses them to sanity-check one; no
# validator rule derives a time from them. Only `session_overhead_minutes` (added once per
# session) and `homework_budget_tolerance_minutes` are read by `classkit validate`.
#
# STATUS: PROVISIONAL — placeholders, not researched values (Q-005 is open). Because they are
# advisory, a wrong constant misguides an estimate; it never fails a build.
#
# A course overrides any of these in course.yaml under `time_constants:`.

# Reading. Technical CS prose with notation and proofs is far slower than general reading.
textbook_pages_per_minute: 0.5        # ~2 min per page
article_words_per_minute: 180

# Video. Assumes students pause and rewind rather than watching straight through.
video_realtime_multiplier: 1.3        # a 10-min video costs ~13 min

# Interactive study.
gem_minutes_per_goal: 6               # one guiding question tutored via the class Gem
exercise_default_minutes: 10

# Overhead added once per study session (opening the material, orienting, closing).
session_overhead_minutes: 2

# Homework (homework module). How far a homework's minutes may drift from its `total_minutes`
# before `homework_budget_fits` warns — when the course's homework-defaults.yaml does not set its
# own `budget_tolerance_minutes`.
homework_budget_tolerance_minutes: 15
