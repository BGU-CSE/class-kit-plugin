# Methodology: question-driven-25
#
# The DEFAULT study-session methodology (D-010). It is one implementation of the
# methodology contract (D-011) — not the framework's only option. A course selects
# its methodology in course.yaml; other teachers may ship their own file here.
#
# No agent or tool may hardcode the numbers below. They are read from this file.

id: question-driven-25
name: Question-driven 25-minute study sessions
summary: >
  Home study is divided into four ~25-minute study sessions per unit. Each session
  declares 3-5 goals, each phrased as a guiding question the student is expected to
  be able to answer, with where its answer is found and the time to study it. Each
  session offers an optional pool of study paths (class Gem, video, textbook); the
  student chooses their own route.

unit:
  total_minutes: 150
  objectives: { min: 2, max: 4 }

home_study:
  total_minutes: 100          # 2 x 50-min academic hours
  sessions_per_unit: 4
  session_minutes: 25
  goals_per_session: { min: 3, max: 5 }
  default_goal_type: question
  allowed_goal_types: [question]
  budget_tolerance_minutes: 3 # a session's est_minutes + overhead may exceed session_minutes by this much (D-020)

in_class:
  scope: unit                 # one meeting per unit, not per study session (D-012 / Q-010)
  minutes: 50
  activities: { min: 3, max: 6 }
  duration_tolerance_minutes: 5
  require_opening_quiz: true  # the entry quiz is what makes the class hour depend on the prework
  max_unmapped_minutes: 10    # activities building on no guiding question may take this much in all (D-028, D-031e)
  allowed_activity_types:
    - quiz
    - discussion
    - critical-thinking
    - worked-example
    - group-work
    - synthesis

study_paths:                  # one optional pool per session, never timed (D-020)
  min_paths_per_session: 1

# Validator rule severities: rule-code -> error | alert | warn | off.
#
# Only departures from the framework defaults (spec §8.4, `DEFAULT_SEVERITY` in
# src/classkit/validate.py) belong here. The defaults follow D-037: a rule that names
# something that does not exist is an `error`; everything pedagogical is advice — `warn`,
# or `alert` for the coverage chain. A course overrides any of this in its own
# course.yaml `rules:` block, which has the last word.
rules:
  # Every guiding question tested by an item: off in Core (D-031c). A short entry quiz cannot test
  # a unit's ~15 questions, so the rule would fire on every valid unit — and a warning that always
  # fires teaches teachers to ignore warnings. `unit_has_entry_quiz_items` checks the quiz exists.
  # A course that wants it sets `guiding_question_assessed: warn` in its course.yaml `rules:`.
  guiding_question_assessed: "off"
